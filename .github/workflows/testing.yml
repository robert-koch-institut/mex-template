name: Testing

on:
  push:
    branches: ["main"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

env:
  FORCE_COLOR: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        containerize: [ "true", "false" ]
        publish_to_pypi: [ "true", "false" ]

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: make setup

      - name: Render template
        run: cruft create --output-dir work --no-input --extra-context '{"project_name":"test","containerize":"${{ matrix.containerize }}","publish_to_pypi":"${{ matrix.publish_to_pypi }}"}' .

      - name: Start containers
        working-directory: work/mex-test
        run: docker compose up --wait --wait-timeout 500 placeholder

      - name: Run smoke test
        working-directory: work/mex-test
        run: uv run pytest

      - name: Cleanup containers
        if: always()
        working-directory: work/mex-test
        run: docker compose down --volumes --remove-orphans
