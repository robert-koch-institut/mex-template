services:
{%- if cookiecutter.containerize %}
  mex-{{ cookiecutter.project_name }}:
    build:
      context: .
    ports:
      - 8080:8080
    healthcheck:
      test: [ "CMD", "curl", "http://0.0.0.0:8080/_system/check" ]
      interval: 60s
      timeout: 5s
      retries: 5
    volumes:
      - data:/app/data
{%- endif %}
  # replace this placeholder with the services your test suite depends on,
  # e.g. a database or a mock server, and start them from the testing workflow
  placeholder:
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    command: [ "sleep", "infinity" ]
    healthcheck:
      test: [ "CMD", "true" ]
      interval: 5s
      timeout: 3s
      retries: 3
{%- if cookiecutter.containerize %}
volumes:
  data:
{%- endif %}
