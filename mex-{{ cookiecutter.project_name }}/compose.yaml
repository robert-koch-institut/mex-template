services:
{%- if cookiecutter.containerize %}
  mex-{{ cookiecutter.project_name }}:
    build:
      context: .
    ports:
      - 8080:8080
    healthcheck:
      test: [ "CMD", "curl", "http://0.0.0.0:8080/_system/check" ]
      interval: 60s
      timeout: 5s
      retries: 5
    volumes:
      - data:/app/data
{%- endif %}
  # replace this placeholder with the services your test suite depends on,
  # e.g. a database or a mock server, and start them from the testing workflow
  placeholder:
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    command: [ "sleep", "infinity" ]
    healthcheck:
      test: [ "CMD", "true" ]
      interval: 5s
      timeout: 3s
      retries: 3
{%- if cookiecutter.containerize %}
volumes:
  data:
{%- endif %}
