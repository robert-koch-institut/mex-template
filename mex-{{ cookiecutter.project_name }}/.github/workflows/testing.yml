name: Testing

on:
  push:
    branches: ["main"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

env:
  FORCE_COLOR: "1"

concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: [ {% for minor in range(cookiecutter.python_version_min.split('.')[1] | int, cookiecutter.python_version_max.split('.')[1] | int + 1) %}"3.{{ minor }}"{{ ", " if not loop.last else "" }}{% endfor %} ]
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start containers
        run: docker compose up --detach placeholder

      - name: Cache environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          {% raw %}key: cache-environment-${{ hashFiles('uv.lock') }}{% endraw %}
          restore-keys: |
            cache-environment-

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "{{ cookiecutter.python_version_max }}"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: |
          {% raw -%}
          echo ${{ matrix.python-version }} > .python-version
          make install
          {%- endraw %}

      - name: Wait for container readiness
        run: docker compose up --wait --wait-timeout 500 placeholder

      - name: Run test suite
        run: make test

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Cleanup containers
        if: always()
        run: docker compose down --volumes --remove-orphans
