name: Cookiecutter

on:
  push:
    branches: ["main"]
    tags: ["**"]
  schedule:
    - cron: "14 3 * * 1-5"
      timezone: "Europe/Berlin"
  workflow_dispatch:

concurrency:
  group: {% raw %}${{ github.workflow }}{% endraw %}
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"

jobs:
  cruft:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "{{ cookiecutter.python_version_max }}"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: make setup

      - name: Configure git
        env:
          MEX_BOT_EMAIL: mex@rki.de
          MEX_BOT_USER: RKIMetadataExchange
          {% raw %}SIGNING_KEY: ${{ secrets.MEX_SIGNING_KEY }}{% endraw %}
          {% raw %}SIGNING_PUB: ${{ vars.MEX_SIGNING_PUB }}{% endraw %}
        run: |
          {% raw -%}
          eval "$(ssh-agent -s)"
          mex setup-commit-signing
          {%- endraw %}

      - name: Update template and commit
        id: update
        env:
          {% raw %}GH_TOKEN: ${{ secrets.MEX_COOKIECUTTER_TOKEN }}{% endraw %}
        run: |
          {% raw -%}
          template_url=$(jq -r .template .cruft.json)
          template_tag=$(git ls-remote --tags --sort=-v:refname "${template_url}" | grep -v '\^{}' | head -1 | sed 's|.*refs/tags/||')
          if cruft check --checkout "${template_tag}"; then
            echo template is up to date
            exit 0
          fi
          if [[ -n "$(gh pr list --label cruft --state open --json number --jq '.[].number')" ]]; then
            echo already seeing pull request
            exit 0
          fi
          echo "template_tag=${template_tag}" >> "$GITHUB_OUTPUT"
          git checkout main
          git checkout -b cruft/mex-template-${template_tag}
          cruft update --checkout "${template_tag}" --skip-apply-ask
          printf '### Changes\n\n- new template %s/releases/tag/%s\n' "$template_url" "$template_tag" > .cruft-pr-body
          sed -i "0,/^### Changes$/{/^### Changes$/{N;N;/\n\n- /{s|\n\n|\n\n- new template ${template_url}/releases/tag/${template_tag}\n|;b;};s|\n\n|\n\n- new template ${template_url}/releases/tag/${template_tag}\n\n|}}" CHANGELOG.md
          rejects=$(find . -type f -name "*.rej")
          if [[ -n "${rejects}" ]]; then
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
            printf '\n### Conflicts\n' >> .cruft-pr-body
            while read -r rej; do
              printf '\n```diff\n%s\n```\n' "$(cat "${rej}")" >> .cruft-pr-body
            done <<< "${rejects}"
          fi
          git add --all --verbose
          git commit --message "Update mex-template to $template_tag" --verbose
          {%- endraw %}

      - name: Push branch
        if: {% raw %}steps.update.outputs.template_tag{% endraw %}
        env:
          {% raw %}GH_TOKEN: ${{ secrets.MEX_COOKIECUTTER_TOKEN }}{% endraw %}
          {% raw %}template_tag: ${{ steps.update.outputs.template_tag }}{% endraw %}
        run: |
          {% raw -%}
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin cruft/mex-template-${template_tag} --force --verbose
          {%- endraw %}

      - name: Create pull request
        if: {% raw %}steps.update.outputs.template_tag{% endraw %}
        env:
          MEX_BOT_USER: RKIMetadataExchange
          {% raw %}GH_TOKEN: ${{ secrets.MEX_COOKIECUTTER_TOKEN }}{% endraw %}
          {% raw %}template_tag: ${{ steps.update.outputs.template_tag }}{% endraw %}
          {% raw %}has_conflicts: ${{ steps.update.outputs.has_conflicts }}{% endraw %}
        run: |
          {% raw -%}
          draft_flag=""
          if [[ "${has_conflicts}" == "true" ]]; then
            draft_flag="--draft"
          fi
          gh pr create \
          --title "Bump cookiecutter template to ${template_tag}" \
          --body-file .cruft-pr-body \
          --label cruft \
          --assignee ${MEX_BOT_USER} \
          ${draft_flag}
          {%- endraw %}
