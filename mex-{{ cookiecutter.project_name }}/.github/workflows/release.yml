name: Release

run-name: bump {% raw %}${{ inputs.version }} version by @${{ github.actor }}{% endraw %}

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: 'part of the project version to update'
        options:
        - major
        - minor
        - patch
        required: true

env:
  FORCE_COLOR: "1"

concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: {% raw %}${{ steps.release.outputs.tag }}{% endraw %}

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "{{ cookiecutter.python_version_max }}"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: make setup

      - name: Configure git
        env:
          MEX_BOT_EMAIL: mex@rki.de
          MEX_BOT_USER: RKIMetadataExchange
          {% raw %}SIGNING_KEY: ${{ secrets.MEX_SIGNING_KEY }}{% endraw %}
          {% raw %}SIGNING_PUB: ${{ vars.MEX_SIGNING_PUB }}{% endraw %}
        run: |
          {% raw -%}
          eval "$(ssh-agent -s)"
          mex setup-commit-signing
          {%- endraw %}

      - name: Release new version
        id: release
        env:
          {% raw %}GH_TOKEN: ${{ secrets.MEX_CONTENT_WRITE_TOKEN }}{% endraw %}
        run: |
          {% raw -%}
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mex release ${{ inputs.version }}
          echo "tag=$(git describe --abbrev=0 --tags)" >> "$GITHUB_OUTPUT"
          {%- endraw %}
{% if cookiecutter.containerize %}
  containerize:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: release
    permissions:
      contents: read
      packages: write
      id-token: write  # Required for cosign signing

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {% raw %}ref: ${{ needs.release.outputs.tag }}{% endraw %}
          persist-credentials: false

      - name: Login to container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: {% raw %}${{github.actor}}{% endraw %}
          password: {% raw %}${{secrets.GITHUB_TOKEN}}{% endraw %}

      - name: Build, tag and push docker image
        id: push_step
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          {% raw %}IMAGE: ghcr.io/${{ github.repository }}{% endraw %}
        with:
          context: .
          push: true
          tags: |
            {% raw -%}${{ env.IMAGE }}:${{ github.sha }}{%- endraw %}
          outputs: type=image,oci-mediatypes=true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Sign Docker image keyless
        env:
          {% raw %}IMAGE: ghcr.io/${{ github.repository }}@${{ steps.push_step.outputs.digest }}{% endraw %}
        run: |
          {% raw %}cosign sign --yes "$IMAGE"{% endraw %}

      - name: Apply release tags
        env:
          {% raw %}IMAGE: ghcr.io/${{ github.repository }}{% endraw %}
          {% raw %}TAG: ${{ needs.release.outputs.tag }}{% endraw %}
          {% raw %}DIGEST: ${{ steps.push_step.outputs.digest }}{% endraw %}
        run: |
          {% raw -%}
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${TAG}" \
            --prefer-index=false \
            "${IMAGE}@${DIGEST}"
          {%- endraw %}
{% endif %}
  distribute:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: release
{%- if cookiecutter.publish_to_pypi %}
    environment:
      name: pypi
      url: https://pypi.org/p/mex-{{ cookiecutter.project_name }}
{%- endif %}
    permissions:
      contents: write
      id-token: write # Required for python release signing{% if cookiecutter.publish_to_pypi %} and trusted publishing{% endif %}

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {% raw %}ref: ${{ needs.release.outputs.tag }}{% endraw %}
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "{{ cookiecutter.python_version_max }}"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: make setup

      - name: Build wheel and sdist distros
        run: |
          uv build --out-dir dist
{% if cookiecutter.publish_to_pypi %}
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
{% endif %}
      - name: Sign Python release artifacts
        run: |
          sigstore sign dist/*

      - name: Create a github release
        env:
          GH_TOKEN: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}
        run: |
          {% raw -%}
          gh release create ${{ needs.release.outputs.tag }} \
          --generate-notes --latest --verify-tag dist/*
          {%- endraw %}
